name: Web client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-client-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Web client quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changes
        id: scope
        uses: ./.github/actions/ci-scope

      - name: Skip unaffected web client checks
        if: steps.scope.outputs.desktop_changed != 'true'
        run: echo "No web client or App Server inputs changed."

      - name: Set up Node
        if: steps.scope.outputs.desktop_changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        if: steps.scope.outputs.desktop_changed == 'true'
        working-directory: desktop
        run: npm ci

      - name: Verify frontend and protocol
        if: steps.scope.outputs.desktop_changed == 'true'
        working-directory: desktop
        run: |
          npm run check:protocol
          npm run typecheck
          npm run lint
          npm test
          npm run build
